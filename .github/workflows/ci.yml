name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Node.js dependencies
        run: npm install

      - name: Install Python dependencies
        run: pip install -r services/agent-worker/requirements.txt

      - name: Commit lint (pull request)
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

      - name: Commit lint (push)
        if: github.event_name == 'push'
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            root_commit="$(git rev-list --max-parents=0 HEAD)"
            npx commitlint --from "$root_commit" --to "${{ github.sha }}"
          else
            npx commitlint --from ${{ github.event.before }} --to ${{ github.sha }}
          fi

      - name: Lint
        run: npm run lint -ws

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build -ws

      - name: Test
        run: |
          npm run test -ws
          pytest services/agent-worker/tests --cov=services/agent-worker --cov-branch --cov-report=term-missing

      - name: Coverage report (lines/branches/statements/functions)
        run: npm run test -w @jarvis/orchestrator -- --coverage --coverageReporters=text-summary --coverageReporters=lcov
